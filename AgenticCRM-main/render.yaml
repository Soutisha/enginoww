services:
  - type: web
    name: bizpilot-api-soutisha
    runtime: docker
    plan: free
    region: singapore
    rootDir: AgenticCRM-main
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DOMAIN
        fromService:
          name: bizpilot-api-soutisha
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ORIGINS
        fromService:
          name: bizpilot-dashboard-soutisha
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: bizpilot-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: bizpilot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: bizpilot-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: API_RATE_LIMIT_TTL_MS
        value: "60000"
      - key: API_RATE_LIMIT_MAX
        value: "100"

  - type: web
    name: bizpilot-dashboard-soutisha
    runtime: docker
    plan: free
    region: singapore
    rootDir: AgenticCRM-main
    dockerfilePath: apps/dashboard/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_HOST
        fromService:
          name: bizpilot-api-soutisha
          type: web
          property: host
